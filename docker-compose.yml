# app + postgres 2컨테이너 구성.
# 실제 환경변수 값은 Coolify가 주입한다 (.env.example 참고).
# 프로젝트명 고정 — 디렉토리명과 무관하게 이미지가 erd-studio-app 으로 생성된다.
name: erd-studio

services:
  db:
    image: postgres:16-alpine
    # 값 미주입 시 postgres가 기동 거부(빈 비밀번호)로 즉시 종료하므로 기본값 필수
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-erd_studio}
    volumes:
      - erd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-erd}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-erd_studio}
      PORT: 3000
      # Coolify 매직 변수: app 서비스 3000 포트에 도메인 자동 할당 (배포 후 링크 생성)
      SERVICE_FQDN_APP_3000: ""
    # 호스트 포트 publish 금지 — Coolify 프록시(FQDN)로만 노출해 포트 충돌 방지.
    # 로컬 개발 포트는 docker-compose.override.yml 에서 열린다 (Coolify는 -f 로 이 파일만 사용).
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    # /api/health 헬스체크 필수 — 실패 시 Coolify가 배포 실패로 간주
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  erd-pgdata:
