<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>애드콘 쿠폰판매 서비스 - 테이블 관계도</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>애드콘(ADCON) 쿠폰판매 서비스 · 테이블 관계도</h1>
      <div class="sub" id="subtitle">DB: 3n1_db (donut) · 관계는 컬럼명 규칙 기반 추론(명시적 FK 없음)</div>
    </div>
    <div class="controls">
      <input id="search" type="text" placeholder="테이블명 검색 (예: bill, point)">
      <button id="reset">전체보기</button>
      <button id="zin">+</button>
      <button id="zout">−</button>
      <button id="editToggle">✏ 편집 모드</button>
    </div>
    <div class="toolbar" id="toolbar">
      <button id="tbAdd">＋ 테이블 추가</button>
      <span class="tbsep"></span>
      <button id="tbSaveServer" class="primary">☁ 서버에 저장</button>
      <button id="tbReload">↺ 서버에서 다시 불러오기</button>
      <span class="tbsep"></span>
      <button id="tbSaveJson">💾 JSON 저장</button>
      <button id="tbLoadJson">📂 JSON 불러오기</button>
      <span class="tbsep"></span>
      <button id="tbSql">⬇ SQL 내보내기</button>
      <button id="tbDbml">⬇ DBML 내보내기</button>
      <span class="tbnote">편집 후 '서버에 저장'을 누르면 PostgreSQL에 반영됩니다</span>
    </div>
  </header>
  <div id="stage">
    <svg id="svg">
      <g id="viewport">
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="footnote">마우스 드래그: 이동 · 휠: 확대/축소 · 노드 클릭: 관계 강조</div>
    <div class="legend" id="legend"></div>
    <div class="panel" id="panel"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
